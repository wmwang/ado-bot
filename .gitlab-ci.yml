stages:
  - orchestrate
  - agent-run

# 1. Control Plane: Orchestrator 排程巡邏 (輕量 Python 環境)
orchestrator-poll:
  stage: orchestrate
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - pip install --no-cache-dir requests
  script:
    - python orchestrator/prototype.py

# 2. Data Plane: Container 化標準 Java/Spring Boot + OpenCode 執行環境
run-agent:
  stage: agent-run
  image: eclipse-temurin:21-jdk
  rules:
    - if: '$AGENT_NAME'
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git curl python3 python3-pip nodejs npm maven && rm -rf /var/lib/apt/lists/*
    - pip3 install --no-cache-dir --break-system-packages requests
    - npm install --global opencode-ai
  script:
    - python3 agents/base_agent.py
